<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    #window { position: fixed; inset: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(30,30,30,.95); backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; }
    #header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,.15); -webkit-app-region: drag; color: #eee; background: rgba(0,0,0,.2); }
    #title { font-size: 15px; font-weight: 600; margin: 0; }
    #controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    #controls button { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #3a3a3a; border: 1px solid #4a4a4a; color: #eee; border-radius: 6px; cursor: pointer; font-size: 16px; transition: all 0.2s; }
    #controls button:hover { background: #4a4a4a; }
    #controls #close { background: #d32f2f; border-color: #b71c1c; color: #fff; }
    #controls #close:hover { background: #f44336; }
    #content { flex: 1; display: flex; min-height: 0; overflow: hidden; }
    #sidebar { width: 250px; background: rgba(0,0,0,.3); border-right: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; }
    #sidebar-header { padding: 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
    #sidebar-header h3 { margin: 0; font-size: 14px; color: #ccc; font-weight: 600; }
    #tables-list { flex: 1; overflow-y: auto; padding: 8px; }
    .table-item { padding: 8px 10px; margin: 4px 0; background: rgba(255,255,255,.05); border-radius: 6px; cursor: pointer; color: #ddd; font-size: 13px; transition: all 0.2s; }
    .table-item:hover { background: rgba(255,255,255,.1); }
    .table-item.active { background: rgba(66, 165, 245, 0.2); border: 1px solid rgba(66, 165, 245, 0.4); }
    .table-name { font-weight: 600; color: #4fc3f7; }
    .table-row-count { font-size: 11px; color: #999; margin-top: 4px; }
    #main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #toolbar { display: flex; gap: 8px; padding: 10px; background: rgba(0,0,0,.25); border-bottom: 1px solid rgba(255,255,255,.1); align-items: center; }
    #toolbar button { padding: 8px 16px; background: #1976d2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    #toolbar button:hover { background: #1565c0; }
    #toolbar button:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
    #toolbar button.secondary { background: #424242; }
    #toolbar button.secondary:hover { background: #616161; }
    #toolbar #exec-btn { background: #4caf50; }
    #toolbar #exec-btn:hover { background: #43a047; }
    #status { margin-left: auto; color: #999; font-size: 12px; }
    #editor-container { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    #editor-wrapper { flex: 1; display: flex; min-height: 0; position: relative; }
    #gutter { width: 50px; background: rgba(0,0,0,.2); border-right: 1px solid rgba(255,255,255,.1); color: #666; font-family: 'Consolas', 'Menlo', monospace; font-size: 13px; line-height: 1.6; user-select: none; padding: 12px 8px; overflow-y: auto; overflow-x: hidden; white-space: pre; text-align: right; }
    #editor { flex: 1; padding: 12px 15px; color: #e0e0e0; font-family: 'Consolas', 'Menlo', monospace; font-size: 14px; line-height: 1.6; outline: none; overflow-y: auto; overflow-x: auto; white-space: pre; tab-size: 2; background: rgba(0,0,0,.1); }
    #editor:focus { outline: none; }
    #result-container { flex: 1; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.15); }
    #result-header { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,.2); }
    #result-header h3 { margin: 0; font-size: 13px; color: #ccc; font-weight: 600; }
    #result-header span { color: #999; font-size: 12px; }
    #result-content { flex: 1; overflow: auto; padding: 15px; }
    #result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #result-table th { background: rgba(255,255,255,.1); color: #fff; padding: 10px; text-align: left; border: 1px solid rgba(255,255,255,.1); font-weight: 600; position: sticky; top: 0; }
    #result-table td { padding: 10px; border: 1px solid rgba(255,255,255,.05); color: #ddd; }
    #result-table tr:hover { background: rgba(255,255,255,.05); }
    .action-buttons { display: flex; gap: 6px; }
    .action-btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; transition: all 0.2s; }
    .edit-btn { background: #1976d2; color: white; }
    .edit-btn:hover { background: #1565c0; }
    .delete-btn { background: #d32f2f; color: white; }
    .delete-btn:hover { background: #c62828; }
    #edit-modal { 
      display: none; 
      position: fixed; 
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,.8); 
      z-index: 10000; 
      align-items: center; 
      justify-content: center; 
    }
    #edit-modal.show { 
      display: flex !important; 
    }
    .modal-content { background: #1e1e1e; border-radius: 10px; padding: 24px; min-width: 500px; max-width: 90vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.1); padding-bottom: 15px; }
    .modal-header h3 { margin: 0; color: #fff; font-size: 18px; }
    .modal-close { background: transparent; border: none; color: #999; font-size: 24px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    .modal-close:hover { background: rgba(255,255,255,.1); color: #fff; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: #ccc; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; color: #fff; font-family: 'Consolas', 'Menlo', monospace; font-size: 13px; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #1976d2; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group input[readonly] { background: rgba(0,0,0,.5); color: #999; cursor: not-allowed; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .modal-actions button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn-cancel { background: #424242; color: white; }
    .btn-cancel:hover { background: #616161; }
    .btn-save { background: #4caf50; color: white; }
    .btn-save:hover { background: #43a047; }
    .error-message { color: #f44336; background: rgba(244, 67, 54, 0.1); padding: 12px; border-radius: 6px; border: 1px solid rgba(244, 67, 54, 0.3); margin: 10px 0; font-family: 'Consolas', 'Menlo', monospace; font-size: 13px; }
    .success-message { color: #4caf50; background: rgba(76, 175, 80, 0.1); padding: 12px; border-radius: 6px; border: 1px solid rgba(76, 175, 80, 0.3); margin: 10px 0; }
    .empty-state { text-align: center; color: #666; padding: 40px; font-size: 14px; }
    #table-info { padding: 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .table-info-row { padding: 6px 0; font-size: 12px; color: #bbb; }
    .table-info-label { color: #888; margin-right: 8px; }
    #query-history { max-height: 200px; overflow-y: auto; padding: 8px; border-top: 1px solid rgba(255,255,255,.1); display: none; }
    #query-history.show { display: block; }
    .history-item { padding: 6px 8px; margin: 4px 0; background: rgba(255,255,255,.05); border-radius: 4px; cursor: pointer; font-size: 12px; color: #ccc; font-family: 'Consolas', 'Menlo', monospace; }
    .history-item:hover { background: rgba(255,255,255,.1); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="window">
    <div id="header">
      <h5 id="title">Editor SQL - Base de Datos CopyFy</h5>
      <div id="controls">
        <button id="minimize" title="Minimizar">─</button>
        <button id="close" title="Cerrar">✕</button>
      </div>
    </div>
    <div id="content">
      <div id="sidebar">
        <div id="sidebar-header">
          <h3>Tablas</h3>
        </div>
        <div id="tables-list">
          <div class="empty-state">Cargando tablas...</div>
        </div>
      </div>
      <div id="main-area">
        <div id="toolbar">
          <button id="exec-btn">▶ Ejecutar (Ctrl+Enter)</button>
          <button id="clear-btn" class="secondary">Limpiar</button>
          <button id="refresh-tables-btn" class="secondary">Actualizar Tablas</button>
          <span id="status">Listo</span>
        </div>
        <div id="editor-container">
          <div id="editor-wrapper">
            <div id="gutter"></div>
            <textarea id="editor" placeholder="Escribe tu consulta SQL aquí...&#10;&#10;Ejemplos:&#10;SELECT * FROM history LIMIT 10;&#10;SELECT * FROM devices;&#10;SELECT COUNT(*) FROM history WHERE is_deleted = 0;"></textarea>
          </div>
        </div>
        <div id="result-container" style="display: none;">
          <div id="result-header">
            <h3>Resultados</h3>
            <span id="result-info"></span>
          </div>
          <div id="result-content"></div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal de Edición -->
  <div id="edit-modal" onclick="if(event.target.id === 'edit-modal' && typeof closeEditModal === 'function') closeEditModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Editar Registro</h3>
        <button class="modal-close" id="modal-close-btn">×</button>
      </div>
      <form id="edit-form">
        <div id="edit-fields"></div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancel-edit-btn">Cancelar</button>
          <button type="submit" class="btn-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="sql-editor.js"></script>
</body>
</html>
